<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>A1 アフォーダンス体験</title>
<style>
  :root{
    --bg:#ffffff;
    --ink:#24333c;
    --sub:#5d6a72;
    --line:#d9e0e4;
    --panel:#f5f7f8;
    --head:#445661;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:var(--bg);color:var(--ink);}
  header{background:var(--head);color:#fff;padding:16px 20px;}
  header h1{margin:0;font-size:1.35rem}
  header p{margin:6px 0 0;font-size:.95rem;opacity:.95}
  main{max-width:980px;margin:24px auto;padding:0 18px 28px;}
  .mission{border:1px solid var(--line);background:#fff;padding:14px 16px;margin-bottom:18px}
  .mission strong{display:block;margin-bottom:6px}
  .site{border:1px solid var(--line);background:#fff;overflow:hidden}
  .site-header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);background:var(--panel)}
  .logo{font-weight:700}
  .nav{display:flex;gap:18px;color:var(--sub);font-size:.94rem;flex-wrap:wrap}
  .hero{padding:24px 20px 10px}
  .hero h2{margin:0 0 10px;font-size:1.4rem}
  .hero p{margin:0;color:var(--sub);line-height:1.7}
  .content{display:grid;grid-template-columns:1.2fr .8fr;gap:24px;padding:18px 20px 28px}
  .block{border:1px solid var(--line);padding:18px;background:var(--panel)}
  .notice{font-size:1rem;line-height:1.8;background:#fff}
  .decoration{display:flex;align-items:center;gap:16px;justify-content:center;min-height:190px;background:#fff}
  .circle{width:84px;height:84px;border-radius:50%;border:4px solid #93a3ad}
  .line{width:110px;height:8px;background:#c5d0d6;border-radius:999px}
  .cta-area{display:flex;justify-content:center;padding:18px 0 8px}
  .blank-button{width:300px;max-width:100%;height:76px;border-radius:16px;border:1px solid #b8c6ce;background:linear-gradient(180deg,#fdfefe 0%, #dde5ea 100%);box-shadow:0 4px 0 #b2c0c8;cursor:pointer}
  .blank-button:hover{filter:brightness(0.98)}
  .feedback{min-height:24px;margin-top:14px;color:#6a3a3a;font-size:.95rem}
  .end{display:none;border:1px solid var(--line);padding:24px;background:#fff;margin-top:18px}
  .end h2{margin-top:0}
  @media (max-width:720px){.content{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>文化祭サイト</h1>
  <p>Activity A1｜見た目から「押せそう」と感じる体験</p>
</header>
<main>
  <section class="mission">
    <strong>MISSION</strong>
    次の画面に進んでください。
  </section>

  <section class="site" id="taskArea">
    <div class="site-header">
      <div class="logo">浜松北高校 文化祭 2026</div>
      <nav class="nav">
        <span>ホーム</span>
        <span>企画紹介</span>
        <span>アクセス</span>
      </nav>
    </div>
    <div class="hero">
      <h2>当日のご案内</h2>
      <p>文化祭の開催時間や企画内容を確認できます。次の画面に進むには、画面の中から進めそうな場所を選んでください。</p>
    </div>
    <div class="cta-area">
      <!-- 文字なしで、ボタンらしく見える形だけを配置 -->
      <button class="blank-button" id="goButton" aria-label="進める場所"></button>
    </div>
    <div class="content">
      <div class="block notice" id="plainText">文化祭のお知らせを確認してください。受付時間は午前9時から午後3時までです。</div>
      <div class="block decoration" id="decor">
        <div class="circle"></div>
        <div class="line"></div>
      </div>
    </div>
  </section>

  <div class="feedback" id="feedback" aria-live="polite"></div>

  <section class="end" id="endScreen">
    <h2>進めました。</h2>
    <p>操作はここまでです。</p>
    <p>この画面のまま、先生の合図を待ちましょう。</p>
  </section>
</main>
<script>
  const feedback = document.getElementById('feedback');
  const end = document.getElementById('endScreen');
  const taskArea = document.getElementById('taskArea');

  function finish(){
    taskArea.style.display = 'none';
    feedback.textContent = '';
    end.style.display = 'block';
  }

  document.getElementById('goButton').addEventListener('click', finish);
  document.getElementById('plainText').addEventListener('click', ()=>{
    feedback.textContent = 'その場所では進みません。';
  });
  document.getElementById('decor').addEventListener('click', ()=>{
    feedback.textContent = 'その場所では進みません。';
  });
</script>
</body>
</html>
